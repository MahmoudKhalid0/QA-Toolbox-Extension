<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cases — QA-Toolbox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 32px 20px 60px; }
        .wrap { max-width: 860px; margin: 0 auto; }
        .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; }
        .brand h1 { font-size: 20px; font-weight: 700; }
        .brand p { font-size: 12px; color: #94a3b8; }
        .btn { border: none; border-radius: 9px; padding: 9px 15px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
        .btn-outline { background: rgba(255,255,255,0.08); color: #cbd5e1; }
        .btn-outline:hover { background: rgba(255,255,255,0.16); color: #fff; }
        .out-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .story { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px 16px; margin: 16px 0 22px; font-size: 13px; color: #94a3b8; line-height: 1.6; }
        .story b { color: #cbd5e1; }
        .count-line { font-size: 14px; color: #cbd5e1; font-weight: 600; margin-bottom: 14px; }

        .tc { border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; margin-bottom: 14px; background: rgba(255,255,255,0.03); overflow: hidden; }
        .tc-head { padding: 11px 16px; background: rgba(99,102,241,0.08); border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .tc-id { font-family: monospace; font-size: 11px; background: #6366f1; color: #fff; border-radius: 4px; padding: 2px 7px; font-weight: 700; }
        .tc-title { font-weight: 600; font-size: 14px; flex: 1; }
        .tc-badge { font-size: 10px; font-weight: 700; border-radius: 20px; padding: 2px 9px; text-transform: capitalize; }
        .p-high { background: rgba(239,68,68,.15); color: #fca5a5; }
        .p-medium { background: rgba(245,158,11,.15); color: #fcd34d; }
        .p-low { background: rgba(16,185,129,.15); color: #6ee7b7; }
        .t-positive { background: rgba(16,185,129,.12); color: #6ee7b7; }
        .t-negative { background: rgba(239,68,68,.12); color: #fca5a5; }
        .t-edge { background: rgba(139,92,246,.14); color: #c4b5fd; }
        .tc-body { padding: 14px 16px; }
        .tc-pre { font-size: 12.5px; color: #94a3b8; font-style: italic; margin-bottom: 12px; }
        .tc-lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #64748b; margin-bottom: 6px; }
        .tc-steps ol { margin: 0 0 0 18px; font-size: 13.5px; color: #cbd5e1; line-height: 1.8; }
        .tc-expected { font-size: 13.5px; color: #cbd5e1; background: rgba(16,185,129,.07); border-left: 3px solid #10b981; padding: 8px 12px; border-radius: 0 4px 4px 0; margin-top: 10px; }

        .empty { text-align: center; padding: 80px 20px; color: #94a3b8; }
        .empty i { font-size: 32px; color: #ef4444; margin-bottom: 14px; }
        .hidden { display: none; }
    </style>
</head>

<body>
    <div class="wrap">
        <div id="emptyView" class="empty hidden">
            <i class="fas fa-triangle-exclamation"></i>
            <p>No test cases found. Generate them from the QA-Toolbox Tools tab.</p>
        </div>

        <div id="reportView" class="hidden">
            <div class="top">
                <div class="brand">
                    <div class="brand-icon"><i class="fas fa-clipboard-list"></i></div>
                    <div>
                        <h1>Test Cases</h1>
                        <p id="genDate"></p>
                    </div>
                </div>
                <div class="out-actions">
                    <button class="btn btn-outline" id="copyBtn"><i class="fas fa-copy"></i> Copy All</button>
                    <button class="btn btn-outline" id="csvBtn"><i class="fas fa-download"></i> Download CSV</button>
                </div>
            </div>
            <div class="story" id="story"></div>
            <div class="count-line" id="outCount"></div>
            <div id="cards"></div>
        </div>
    </div>

    <script src="testcases.js"></script>
</body>

</html>
