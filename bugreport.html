<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Report — QA-Toolbox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 32px 20px 60px; }
        .wrap { max-width: 820px; margin: 0 auto; }
        .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #ef4444, #f97316); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; }
        .brand h1 { font-size: 20px; font-weight: 700; }
        .brand p { font-size: 12px; color: #94a3b8; }
        .btn { border: none; border-radius: 9px; padding: 9px 15px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
        .btn-outline { background: rgba(255,255,255,0.08); color: #cbd5e1; }
        .btn-outline:hover { background: rgba(255,255,255,0.16); color: #fff; }

        .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; overflow: hidden; }
        .rep-body { padding: 20px 22px; }
        .sec { margin-bottom: 16px; }
        .sec-lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #818cf8; margin-bottom: 5px; }
        .sec-val { font-size: 14px; color: #cbd5e1; line-height: 1.7; }
        .sec-val ol, .sec-val ul { margin: 4px 0 0 18px; }
        .sec-val strong { color: #fff; }
        .badge { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 20px; padding: 3px 11px; }
        .sev-critical { background: rgba(239,68,68,.15); color: #fca5a5; }
        .sev-medium { background: rgba(245,158,11,.15); color: #fcd34d; }
        .sev-low { background: rgba(16,185,129,.15); color: #6ee7b7; }

        .empty { text-align: center; padding: 80px 20px; color: #94a3b8; }
        .empty i { font-size: 32px; color: #ef4444; margin-bottom: 14px; }
        .hidden { display: none; }
    </style>
</head>

<body>
    <div class="wrap">
        <div id="emptyView" class="empty hidden">
            <i class="fas fa-triangle-exclamation"></i>
            <p>No bug report found. Generate one from the QA-Toolbox Tools tab.</p>
        </div>

        <div id="reportView" class="hidden">
            <div class="top">
                <div class="brand">
                    <div class="brand-icon"><i class="fas fa-bug"></i></div>
                    <div>
                        <h1>Bug Report</h1>
                        <p id="genDate"></p>
                    </div>
                </div>
                <div style="display:flex;gap:8px;">
                    <button class="btn btn-outline" id="copyBtn"><i class="fas fa-copy"></i> Copy</button>
                    <button class="btn btn-outline" id="csvBtn"><i class="fas fa-download"></i> CSV</button>
                </div>
            </div>
            <div class="card">
                <div class="rep-body" id="repBody"></div>
            </div>
        </div>
    </div>

    <script src="bugreport.js"></script>
</body>

</html>
