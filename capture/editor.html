<!DOCTYPE html>
<html>

<head>
    <title>Capture Editor - QA Testing Toolkit</title>
    <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="editor.css">
</head>

<!-- Boots hidden: the markup defaults to the image case, so an empty 300x150
     canvas and the drawing toolbar would paint for a beat before initEditor
     works out this is a recording and hides them. Cleared the moment there is
     something real on screen (see toggleLoader). -->

<body class="booting">
    <div class="toolbar">
        <div class="logo">QA Toolkit</div>

        <div class="tools">
            <div class="shapes-group" id="shapesGroup">
                <button id="mainShapeBtn" title="Shapes">
                    <i class="fas fa-shapes"></i>
                    <i class="fas fa-chevron-down" style="font-size: 8px;"></i>
                </button>
                <div class="shapes-dropdown">
                    <button id="arrowBtn" title="Arrow"><i class="fas fa-location-arrow"></i></button>
                    <button id="pencilBtn" title="Freehand"><i class="fas fa-pencil-alt"></i></button>
                    <button id="lineBtn" title="Line"><i class="fas fa-minus"></i></button>
                    <button id="rectBtn" title="Rectangle"><i class="far fa-square"></i></button>
                    <button id="circleBtn" title="Circle"><i class="far fa-circle"></i></button>
                    <button id="blurBtn" title="Blur / Redact"><i class="fas fa-eye-slash"></i></button>
                    <button id="stepBtn" title="Numbered Step"><i class="fas fa-list-ol"></i></button>
                </div>
            </div>

            <button id="textBtn" title="Text"><i class="fas fa-font"></i></button>
            <button id="cropBtn" title="Crop Selection"><i class="fas fa-crop-alt"></i></button>
            <button id="frameBtn" title="Wrap in a browser window (shows the page URL)"><i class="fas fa-window-maximize"></i></button>
            <!-- Light/dark chooser for the browser frame -->
            <div id="framePop" class="frame-pop">
                <div class="frame-pop-t">Browser frame</div>
                <button data-theme="light" title="Click again to remove the frame">
                    <span class="fp-sw fp-light"></span>Light<i class="fas fa-check fp-tick"></i>
                </button>
                <button data-theme="dark" title="Click again to remove the frame">
                    <span class="fp-sw fp-dark"></span>Dark<i class="fas fa-check fp-tick"></i>
                </button>
            </div>

            <div class="separator"></div>

            <button id="uploadBtn" title="Overlay Image"><i class="fas fa-image"></i></button>
            <input type="file" id="imageInput" accept="image/*" style="display: none;">

            <div class="separator"></div>

            <!-- The preset swatches were removed: they stretched the toolbar. The
                 colour picker alone covers every colour. -->
            <input type="color" id="colorPicker" value="#ff0000" title="Color Picker">
            <button id="fillToggleBtn" title="Fill Shape (rectangle/circle)"><i class="fas fa-fill-drip"></i></button>
            <input type="number" id="lineWidth" value="3" min="1" max="20" title="Stroke Width">
            <input type="range" id="opacitySlider" min="10" max="100" value="100" title="Opacity">
            <span class="opacity-value" id="opacityValue">100%</span>

            <div id="headerCropControls" style="display: none; align-items: center; gap: 8px;">
                <div class="separator"></div>
                <button id="confirmCropBtn" class="primary" style="background: var(--accent-green);"
                    title="Confirm Crop">
                    <i class="fas fa-check"></i> Crop
                </button>
                <button id="cancelCropBtn" class="primary" style="background: var(--accent-red);" title="Cancel Crop">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <div class="actions">
            <button id="undoBtn" title="Undo"><i class="fas fa-rotate-left"></i></button>
            <button id="redoBtn" title="Redo"><i class="fas fa-rotate-right"></i></button>
            <button id="deleteBtn" title="Delete Selected" disabled><i class="fas fa-trash-can"></i></button>

            <div class="separator"></div>

            <button id="copyBtn" title="Copy to Clipboard"><i class="far fa-copy"></i></button>
            <button id="saveBtn" class="primary" title="Download Image/Video"><i class="fas fa-download"></i></button>
            <button id="cloudUploadBtn" class="primary"
                style="background: #2ed573; box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);" title="Save to Cloud">
                <i class="fas fa-cloud-upload-alt"></i>
            </button>
            <button id="viewHistoryBtn" title="View Gallery"><i class="fas fa-photo-film"></i></button>
            <button id="ctxBtn" title="Page context recorded with this capture"><i class="fas fa-circle-info"></i></button>
            <button id="reportBugBtn" class="bug-btn" title="Report Bug"><i class="fas fa-bug"></i> Report</button>
        </div>
    </div>

    <div class="workspace" id="workspace">
        <div id="canvasContainer">
            <canvas id="canvas"></canvas>
            <video id="videoPlayer" controls style="display: none;"></video>
            <div id="overlayContainer"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Bug Report Modal -->
    <div id="bugModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-bug"></i> Create Bug Report</h3>
                <button class="modal-close" id="closeBugModal">&times;</button>
            </div>

            <div class="modal-body">
                <div class="form-group" id="bugTargetGroup">
                    <label for="bugTarget">Send to</label>
                    <select id="bugTarget">
                        <option value="azure">Azure DevOps</option>
                        <option value="jira">Jira</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group" id="bugOrgGroup">
                        <label for="bugOrg" class="required">Organization</label>
                        <select id="bugOrg">
                            <option value="">Select Organization</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="bugProject" class="required">Project</label>
                        <select id="bugProject" disabled>
                            <option value="">Select Org First</option>
                        </select>
                    </div>
                </div>

                <!-- One line in, a whole report out: Claude reads the screenshot and
                     the console/network recorded with it. -->
                <div class="form-group ai-assist">
                    <label for="aiNote"><i class="fas fa-wand-magic-sparkles"></i> Describe the bug (AI writes the report)</label>
                    <div class="ai-row">
                        <input type="text" id="aiNote" placeholder="e.g. the Save button does nothing on the profile page">
                        <button type="button" id="aiWriteBtn"><i class="fas fa-wand-magic-sparkles"></i> Generate</button>
                    </div>
                    <span class="ai-hint" id="aiHint">Claude looks at the screenshot and the recorded logs, then fills the fields below.</span>
                </div>

                <div class="form-group full-row">
                    <label for="bugTitle" class="required">Bug Title</label>
                    <input type="text" id="bugTitle" placeholder="What happened?">
                </div>

                <!-- Linked Issues belongs right under the title, above the
                     description: it answers "what does this bug touch?" -->
                <div id="jiraTopFields" class="jira-only" style="display:none;"></div>

                <div class="form-group full-row">
                    <label>Description & Repro Steps</label>
                    <div class="rich-text-container">
                        <div class="rich-text-toolbar">
                            <button type="button" class="rich-toolbar-btn" id="rtBold" title="Bold"><i
                                    class="fas fa-bold"></i></button>
                            <button type="button" class="rich-toolbar-btn" id="rtItalic" title="Italic"><i
                                    class="fas fa-italic"></i></button>
                            <button type="button" class="rich-toolbar-btn" id="rtUnderline" title="Underline"><i
                                    class="fas fa-underline"></i></button>
                            <div class="rt-separator"></div>
                            <button type="button" class="rich-toolbar-btn" id="rtBullet" title="Bullet List"><i
                                    class="fas fa-list-ul"></i></button>
                            <button type="button" class="rich-toolbar-btn" id="rtOrderedList" title="Numbered List"><i
                                    class="fas fa-list-ol"></i></button>
                            <div class="rt-separator"></div>
                            <div class="rich-toolbar-btn color-tool">
                                <i class="fas fa-font"></i>
                                <input type="color" id="rtFontColor" title="Font Color">
                            </div>
                            <div class="rich-toolbar-btn color-tool">
                                <i class="fas fa-highlighter"></i>
                                <input type="color" id="rtBackColor" value="#ffff00" title="Highlight">
                            </div>
                            <div class="rt-separator"></div>
                            <button type="button" class="rich-toolbar-btn" id="rtLink" title="Insert Link"><i
                                    class="fas fa-link"></i></button>
                            <button type="button" class="rich-toolbar-btn" id="rtCode" title="Inline Code"><i
                                    class="fas fa-code"></i></button>
                            <button type="button" class="rich-toolbar-btn" id="rtQuote" title="Quote"><i
                                    class="fas fa-quote-right"></i></button>
                            <div class="rt-separator"></div>
                            <button type="button" class="rich-toolbar-btn" id="rtImage" title="Insert Image (or just paste one)"><i
                                    class="fas fa-image"></i></button>
                            <input type="file" id="rtImageInput" accept="image/*" multiple hidden>
                            <div class="rt-separator"></div>
                            <button type="button" class="rich-toolbar-btn" id="rtClear" title="Clear Formatting"><i
                                    class="fas fa-eraser"></i></button>
                        </div>
                        <div id="bugDescription" contenteditable="true"
                             data-placeholder="Describe the bug. Paste or drop screenshots straight in."></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Attachments</label>
                    <div class="file-upload-container">
                        <label for="bugAttachments" class="file-upload-label">
                            <i class="fas fa-cloud-upload-alt"></i> Choose Files
                        </label>
                        <input type="file" id="bugAttachments" multiple accept="image/*,video/*" style="display: none;">
                        <span class="file-upload-hint">or press Ctrl+V to paste a screenshot</span>
                        <div id="bugAttachmentList" class="file-list"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="bugAssignedTo" class="required">Assigned To</label>
                        <div class="multi-select-container">
                            <div id="bugAssignedToPills" class="tags-pills-container"></div>
                            <input type="text" id="bugAssignedToSearch" placeholder="Search team members...">
                            <div id="bugAssignedToResults" class="multi-select-content"></div>
                        </div>
                        <input type="hidden" id="bugAssignedTo">
                    </div>
                    <div class="form-group">
                        <label for="bugDirectManager" class="required">Direct Manager</label>
                        <div class="multi-select-container">
                            <div id="bugDirectManagerPills" class="tags-pills-container"></div>
                            <input type="text" id="bugDirectManagerSearch" placeholder="Search managers...">
                            <div id="bugDirectManagerResults" class="multi-select-content"></div>
                        </div>
                        <input type="hidden" id="bugDirectManager">
                    </div>
                </div>

                <!-- Jira's own fields. Its model has no Severity, Area or Iteration;
                     it has issue types, priorities, labels and assignees. -->
                <!-- This tool only files bugs, so the issue type never varies.
                     Kept as a hidden input the submit path reads. -->
                <input type="hidden" id="jiraIssueType" value="Bug">

                <!-- Whatever this project's create screen exposes, nothing more.
                     Required fields are added for you; the rest are opt-in,
                     exactly like Azure's "Add New Field". -->
                <input type="hidden" id="jiraIssueType">
                <div id="jiraFieldsContainer" class="jira-only" style="display:none;"></div>

                <div class="add-field-section jira-only" style="display:none;">
                    <button type="button" id="jiraAddFieldBtn" class="btn-ghost">
                        <i class="fas fa-plus"></i> Add New Field
                    </button>
                    <div id="jiraAddFieldMenu" class="add-field-menu">
                        <div class="menu-search">
                            <input type="text" id="jiraFieldSearch" placeholder="Search fields...">
                        </div>
                        <div id="jiraFieldList" class="field-list-items"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="bugSeverity" class="required">Severity</label>
                        <select id="bugSeverity">
                            <option value="">Loading&hellip;</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="bugFoundIn">Stage</label>
                        <select id="bugFoundIn">
                            <option value="">Select Stage</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="bugParent" class="required">Parent Work Item</label>
                    <div class="multi-select-container">
                        <input type="text" id="bugParentSearch" placeholder="Search by ID or Title...">
                        <div id="bugParentResults" class="multi-select-content"></div>
                    </div>
                    <input type="hidden" id="bugParent">
                </div>

                <!-- Read-only, computed the instant a Parent Work Item is picked -
                     nothing for the user to do here, so nothing to show them. -->
                <input type="hidden" id="bugArea">
                <input type="hidden" id="bugIteration">

                <div class="form-group">
                    <label for="bugTags">Tags</label>
                    <div class="multi-select-container">
                        <div id="bugTagsPills" class="tags-pills-container"></div>
                        <input type="text" id="bugTagsSearch" placeholder="Add tags...">
                        <div id="bugTagsResults" class="multi-select-content"></div>
                    </div>
                    <input type="hidden" id="bugTags">
                </div>

                <div id="dynamicFieldsContainer" class="azure-only"></div>

                <div class="add-field-section azure-only">
                    <button type="button" id="addFieldBtn" class="btn-ghost" disabled>
                        <i class="fas fa-plus"></i> <span id="addFieldLabel">Select a project first</span>
                    </button>
                    <div id="addFieldMenu" class="add-field-menu">
                        <div class="menu-search">
                            <input type="text" id="fieldSearch" placeholder="Search fields...">
                        </div>
                        <div id="fieldList" class="field-list-items"></div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button id="cancelBugBtn" class="btn-secondary">Cancel</button>
                <button id="submitBugBtn" class="primary"><i class="fas fa-paper-plane"></i> Submit Bug</button>
            </div>
        </div>
    </div>

    <div id="globalLoader" class="loader-overlay">
        <div class="spinner"></div>
        <div class="loader-text" id="loaderText">Processing...</div>
    </div>

    <!-- Custom Modal System -->
    <div id="customModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Confirmation</h3>
                <button class="modal-close" id="modalCloseBtn">&times;</button>
            </div>
            <div class="modal-body">
                <p id="modalMessage"></p>
                <div id="modalInputContainer" style="display: none; margin-top: 15px;">
                    <label
                        style="display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-secondary);">Capture
                        Title</label>
                    <input type="text" id="modalInput" placeholder="Enter title...">
                </div>
            </div>
            <div class="modal-footer">
                <button id="modalSecondaryBtn" class="btn-secondary">Cancel</button>
                <button id="modalPrimaryBtn" class="primary">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Share to Drive: title + which workspace (Drive subfolder) it is filed into -->
    <div id="shareModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Share this capture</h3>
                <button class="modal-close" id="shareModalCloseBtn">&times;</button>
            </div>
            <div class="modal-body">
                <p>Name it, so you can find it in Drive later:</p>
                <div style="margin-top: 15px;">
                    <label style="display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-secondary);">Title</label>
                    <input type="text" id="shareTitleInput" placeholder="Enter title...">
                </div>
                <div style="margin-top: 15px;">
                    <label style="display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-secondary);">Workspace</label>
                    <select id="shareWorkspaceSelect"></select>
                    <input type="text" id="shareWorkspaceNew" placeholder="New workspace name..." style="display: none; margin-top: 8px;">
                </div>
            </div>
            <div class="modal-footer">
                <button id="shareModalCancelBtn" class="btn-secondary">Cancel</button>
                <button id="shareModalConfirmBtn" class="primary">Share</button>
            </div>
        </div>
    </div>

    <!-- Everything the page was doing when the shot was taken -->
    <aside class="ctx-drawer" id="ctxDrawer">
        <div class="ctx-head">
            <span><i class="fas fa-circle-info"></i> Page context</span>
            <button id="ctxClose" title="Close"><i class="fas fa-xmark"></i></button>
        </div>
        <div class="ctx-body" id="ctxBody"></div>
        <button class="ctx-copy" id="ctxCopy"><i class="fas fa-file-lines"></i> Copy bug report</button>
    </aside>

    <!-- Reads the recording straight out of IndexedDB as a Blob (see cap-store.js);
         a module script defers, so this classic one is ready before editor.js runs. -->
    <script src="cap-store.js"></script>
    <script type="module" src="editor.js"></script>
</body>

</html>
