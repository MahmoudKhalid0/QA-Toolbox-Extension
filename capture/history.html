<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Capture Gallery - QA Testing Toolkit</title>
    <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 34px 22px 60px;
        }

        .wrap { max-width: 1380px; margin: 0 auto; }

        /* ── workspace sidebar ── */
        .gallery-layout { display: flex; align-items: flex-start; gap: 28px; }
        .gallery-main { flex: 1; min-width: 0; }  /* min-width:0 lets the grid shrink inside flex */

        .ws-sidebar {
            flex: 0 0 200px;
            position: sticky; top: 20px;
            /* A definite height, not max-height: a flex child cannot compute a
               shrink target against a cap the container may never actually
               reach, only against a real number. A short list simply leaves
               blank space below it, same as any fixed-height side nav. */
            height: calc(100vh - 40px);
            display: flex; flex-direction: column;
        }
        .ws-sidebar h4 {
            font: 700 11px inherit; letter-spacing: .7px; text-transform: uppercase;
            color: #6b7280; margin-bottom: 12px; flex: 0 0 auto;
        }
        .ws-list {
            /* A flex child's default min-height is auto - it grows to fit its
               content instead of respecting the parent's max-height, so it never
               actually overflows on its own. flex + min-height:0 caps it at
               whatever space .ws-sidebar has left, which is what makes the
               overflow (and therefore this scrollbar) real. */
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 3px;
            padding-right: 4px;
        }
        /* While a delete is in flight: no other row is clickable, so a second
           workspace can't be deleted mid-operation and race the first. */
        .ws-list.busy { opacity: .55; pointer-events: none; }
        /* A thin, dark scrollbar - the OS default is a pale bar that reads as
           belonging to some other, lighter app. This is Chromium-only, which
           is fine: this extension only ever runs in a Chromium browser. */
        .ws-list::-webkit-scrollbar { width: 6px; }
        .ws-list::-webkit-scrollbar-track { background: transparent; }
        .ws-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
        .ws-list::-webkit-scrollbar-thumb:hover { background: rgba(102,126,234,0.55); }
        .ws-item {
            /* .ws-list is itself a flex column; without this, flex-shrink's
               default of 1 squeezes every row to fit the box instead of letting
               them overflow it - which is what actually makes the list scroll. */
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            padding: 9px 12px; border-radius: 10px; cursor: pointer;
            font-size: 13px; color: #9ca3af; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent;
        }
        .ws-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .ws-item.active { background: rgba(102,126,234,0.18); color: #fff; border-color: rgba(102,126,234,0.4); }
        .ws-item .ws-name { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
        .ws-item .ws-count { font-size: 11px; color: #6b7280; flex: 0 0 auto; }
        .ws-item.active .ws-count { color: #c7d2fe; }
        /* Hidden until hovered, so the list reads as names first, danger second. */
        .ws-item .ws-del {
            flex: 0 0 auto; opacity: 0; width: 20px; height: 20px; border-radius: 6px;
            border: none; background: transparent; color: #9ca3af; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 11px;
            transition: opacity .12s, background .12s, color .12s;
        }
        .ws-item:hover .ws-del { opacity: 1; }
        .ws-item .ws-del:hover { background: rgba(239,68,68,0.25); color: #fca5a5; }

        .ws-item.ws-add { color: #667eea; border: 1px dashed rgba(102,126,234,0.35); }
        .ws-item.ws-add:hover { background: rgba(102,126,234,0.1); color: #8b9cf5; }
        .ws-item.ws-add .ws-name { display: flex; align-items: center; gap: 7px; }

        #wsAddInput {
            width: 100%; background: rgba(0,0,0,0.25); border: 1px solid var(--glass-border, rgba(102,126,234,0.4));
            border-radius: 8px; color: #fff; font-size: 13px; padding: 7px 9px; box-sizing: border-box;
        }
        #wsAddInput:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }

        @media (max-width: 900px) {
            .gallery-layout { flex-direction: column; }
            .ws-sidebar { flex: 0 0 auto; width: 100%; position: static; max-height: none; }
            .ws-list { max-height: 220px; }
        }

        /* ── header ── */
        .head { display: flex; align-items: center; gap: 15px; margin-bottom: 26px; }
        .head-icon {
            width: 44px; height: 44px; border-radius: 13px; flex: 0 0 auto;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            display: flex; align-items: center; justify-content: center; font-size: 19px; color: #fff;
        }
        .head h1 { font-size: 23px; font-weight: 700; }
        .head p { font-size: 12.5px; color: #6b7280; margin-top: 2px; }
        .head-actions { margin-left: auto; display: flex; gap: 9px; }

        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 15px; border-radius: 10px; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04); color: #cbd5e1;
            font: 600 12.5px inherit; transition: all .18s;
        }
        .btn:hover { background: rgba(255,255,255,0.09); color: #fff; border-color: #667eea; }
        .btn.danger:hover { border-color: #ef4444; color: #fca5a5; }
        .btn:disabled { opacity: .4; cursor: not-allowed; }

        /* ── toolbar ── */
        .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .search { position: relative; flex: 1; min-width: 220px; }
        .search i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #6b7280; font-size: 12px; }
        .search input {
            width: 100%; padding: 11px 13px 11px 34px; border-radius: 11px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
            color: #e0e0e0; font: 13px inherit; outline: none;
        }
        .search input:focus { border-color: #667eea; }

        .tabs { display: flex; gap: 4px; background: rgba(255,255,255,0.04); border-radius: 11px; padding: 4px; }
        .tab {
            border: none; background: none; color: #9ca3af; cursor: pointer;
            padding: 8px 15px; border-radius: 8px; font: 600 12px inherit;
            display: inline-flex; align-items: center; gap: 7px;
        }
        .tab.active { background: #667eea; color: #fff; }
        .tab .n { font-size: 10.5px; opacity: .8; }

        /* ── grid ── */
        .grid { display: grid; gap: 17px; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); }

        .card {
            position: relative;   /* so the .pick checkbox anchors to the card, not the page */
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 15px; overflow: hidden;
            transition: border-color .18s, transform .18s;
            display: flex; flex-direction: column;
        }
        .card:hover { border-color: rgba(102,126,234,0.55); transform: translateY(-2px); }

        /* Deleting takes a Drive round trip for a shared capture. The whole card
           is what's going away, so it dims as a whole and the spinner sits over
           it - not swapped into the little trash button, which read as if only
           that button was busy. Clicks are blocked while it runs. */
        .card.deleting { pointer-events: none; opacity: .55; }
        .card.deleting:hover { transform: none; }
        .card .card-busy {
            position: absolute; inset: 0; z-index: 3;
            display: flex; align-items: center; justify-content: center;
            background: rgba(11,11,26,0.55); backdrop-filter: blur(1px);
            color: #fff; font-size: 22px;
        }

        .thumb { position: relative; aspect-ratio: 16/10; background: #0b0b1a; cursor: pointer; overflow: hidden; }
        .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .thumb .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #2f2f4a; font-size: 34px; }
        .thumb .play-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.9); font-size: 32px; text-shadow: 0 2px 10px rgba(0,0,0,0.6);
            pointer-events: none;
        }

        .badges { position: absolute; top: 9px; left: 9px; display: flex; gap: 6px; }
        .badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 8px; border-radius: 7px; font: 700 9.5px inherit;
            text-transform: uppercase; letter-spacing: .4px;
            backdrop-filter: blur(6px); background: rgba(0,0,0,0.55); color: #cbd5e1;
        }
        .badge.err { background: rgba(239,68,68,0.85); color: #fff; }
        .badge.net { background: rgba(245,158,11,0.85); color: #1a1a1a; }
        .badge.cloud { background: rgba(16,185,129,0.85); color: #06281d; }
        .badge.video { background: rgba(139,92,246,0.85); color: #fff; }

        .meta { padding: 12px 13px 13px; }
        .title { font-size: 13px; font-weight: 600; color: #e5e7eb; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sub { font-size: 11px; color: #6b7280; display: flex; align-items: center; gap: 7px; }
        .sub .dot { opacity: .5; }

        .acts { display: flex; gap: 6px; margin-top: 11px; }
        .acts button {
            flex: 1; border: none; border-radius: 8px; cursor: pointer;
            background: rgba(255,255,255,0.05); color: #9ca3af;
            padding: 7px 0; font-size: 11px; transition: all .15s;
        }
        .acts button:hover { background: rgba(102,126,234,0.3); color: #fff; }
        .acts button.del:hover { background: rgba(239,68,68,0.3); color: #fca5a5; }

        /* ── empty / loader ── */
        .empty { text-align: center; padding: 90px 20px; color: #4b5563; }
        .empty i { font-size: 46px; margin-bottom: 16px; opacity: .35; }
        .empty h3 { font-size: 16px; color: #6b7280; margin-bottom: 6px; }
        .empty p { font-size: 12.5px; }

        .loader { text-align: center; padding: 70px; color: #6b7280; }
        .spin {
            width: 30px; height: 30px; margin: 0 auto 14px;
            border: 3px solid rgba(255,255,255,0.08); border-top-color: #667eea;
            border-radius: 50%; animation: sp .8s linear infinite;
        }
        @keyframes sp { to { transform: rotate(360deg); } }

        /* ── confirm ── */
        .confirm { position: fixed; inset: 0; z-index: 200; display: none; place-items: center;
            background: rgba(4,4,12,0.86); backdrop-filter: blur(5px); padding: 20px; }
        .confirm.open { display: grid; }
        .confirm-box { width: 100%; max-width: 420px; background: #14142a;
            border: 1px solid rgba(255,255,255,0.09); border-radius: 18px; overflow: hidden; }
        .confirm-box header { display: flex; align-items: center; gap: 11px; padding: 17px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.07); font-size: 15px; font-weight: 600; }
        .confirm-box header i { color: #fca5a5; }
        .confirm-box p { padding: 18px 20px 6px; font-size: 13.5px; line-height: 1.65; color: #b6b8c8; }
        .confirm-box p.warn { padding-top: 0; color: #fca5a5; }
        .confirm-box footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 20px 20px; }
        .confirm-box button { border: none; border-radius: 10px; padding: 10px 18px; font-size: 13px;
            font-weight: 600; cursor: pointer; font-family: inherit; }
        .confirm-cancel { background: rgba(255,255,255,0.07); color: #cbd0e0; }
        .confirm-cancel:hover { background: rgba(255,255,255,0.12); }
        .confirm-ok { background: #ef4444; color: #fff; }
        .confirm-ok:hover { background: #dc2626; }

        /* ── preview ── */
        .overlay {
            position: fixed; inset: 0; z-index: 100; display: none;
            background: rgba(4,4,12,0.86); backdrop-filter: blur(5px);
            padding: 34px; overflow-y: auto;
        }
        .overlay.open { display: block; }

        .modal { max-width: 1080px; margin: 0 auto; background: #14142a; border: 1px solid rgba(255,255,255,0.09); border-radius: 18px; overflow: hidden; }
        .modal-head { display: flex; align-items: center; gap: 12px; padding: 15px 18px; border-bottom: 1px solid rgba(255,255,255,0.07); }
        .modal-head h2 { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .x { border: none; background: rgba(255,255,255,0.06); color: #9ca3af; width: 32px; height: 32px; border-radius: 9px; cursor: pointer; }
        .x:hover { background: rgba(239,68,68,0.25); color: #fca5a5; }

        .modal-body { display: grid; grid-template-columns: 1.55fr 1fr; }
        @media (max-width: 900px) { .modal-body { grid-template-columns: 1fr; } }

        .stage { background: #07070f; display: flex; align-items: center; justify-content: center; padding: 14px; }
        .stage img, .stage video { max-width: 100%; max-height: 72vh; border-radius: 8px; }

        .side { padding: 17px; border-left: 1px solid rgba(255,255,255,0.07); max-height: 72vh; overflow-y: auto; }
        @media (max-width: 900px) { .side { border-left: none; border-top: 1px solid rgba(255,255,255,0.07); } }

        .sec-title { font: 700 10px inherit; letter-spacing: .8px; text-transform: uppercase; color: #667eea; margin: 18px 0 9px; display: flex; align-items: center; gap: 7px; }
        .sec-title:first-child { margin-top: 0; }
        .sec-title .cnt { margin-left: auto; color: #6b7280; letter-spacing: 0; }

        .kv { display: grid; grid-template-columns: 88px 1fr; gap: 6px 10px; font-size: 11.5px; }
        .kv dt { color: #6b7280; }
        .kv dd { color: #cbd5e1; word-break: break-word; }
        .kv dd a { color: #8b5cf6; text-decoration: none; }
        .kv dd a:hover { text-decoration: underline; }

        .log {
            background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 9px; padding: 9px 11px; margin-bottom: 6px;
            font: 11px/1.55 Consolas, monospace; color: #fca5a5;
            word-break: break-word; max-height: 96px; overflow-y: auto;
        }
        /* one row per console entry, coloured by level */
        .log { display: flex; gap: 9px; align-items: baseline; color: #cbd5e1; }
        .log .lv { flex: 0 0 auto; font-size: 8.5px; font-weight: 700; text-transform: uppercase;
                   letter-spacing: .5px; padding: 2px 6px; border-radius: 5px;
                   background: rgba(255,255,255,0.07); color: #9ca3af; }
        .log .msg { flex: 1; min-width: 0; word-break: break-word; }
        .log .src { flex: 0 0 auto; font-size: 9.5px; color: #4b5563; }
        .log.lvl-error { color: #fca5a5; border-color: rgba(239,68,68,0.28); }
        .log.lvl-error .lv { background: rgba(239,68,68,0.3); color: #fecaca; }
        .log.lvl-warn { color: #fcd34d; }
        .log.lvl-warn .lv { background: rgba(245,158,11,0.28); color: #fde68a; }
        .log.lvl-info .lv, .log.lvl-debug .lv { background: rgba(56,189,248,0.22); color: #7dd3fc; }
        .log.req { color: #fcd34d; display: flex; gap: 9px; align-items: baseline; }
        .log .st { font-weight: 700; flex: 0 0 auto; }
        .log .u { color: #9ca3af; word-break: break-all; }
        .none { font-size: 11.5px; color: #4b5563; padding: 3px 0 5px; }

        .copy-ctx { width: 100%; margin-top: 16px; justify-content: center; }

        /* stats strip */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 13px; padding: 14px 16px; }
        .stat .v { font-size: 21px; font-weight: 800; color: #fff; }
        .stat .l { font-size: 10.5px; color: #6b7280; text-transform: uppercase; letter-spacing: .6px; margin-top: 3px; }
        .stat.warn .v { color: #fca5a5; }
        .stat.ok .v { color: #6ee7b7; }

        .sel {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
            color: #cbd5e1; border-radius: 11px; padding: 11px 13px; font: 12.5px inherit;
            outline: none; cursor: pointer;
        }
        .sel:focus { border-color: #667eea; }
        .sel option { background: #16162e; }

        .selall { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; font-size: 12px; color: #9ca3af; cursor: pointer; }
        .selall input { accent-color: #667eea; cursor: pointer; }

        /* bulk actions */
        .bulk { display: none; align-items: center; gap: 10px; margin-bottom: 18px; padding: 11px 15px;
                background: rgba(102,126,234,0.12); border: 1px solid rgba(102,126,234,0.35); border-radius: 12px; }
        .bulk.show { display: flex; }
        .bulk span { font-size: 12.5px; font-weight: 600; color: #c7d2fe; margin-right: auto; }

        /* date group headings */
        .group-h { font: 700 11px inherit; letter-spacing: .7px; text-transform: uppercase; color: #6b7280; margin: 26px 0 13px; }
        .group-h:first-child { margin-top: 0; }

        .card.picked { border-color: #667eea; box-shadow: 0 0 0 2px rgba(102,126,234,0.35); }
        /* Hidden until you hover the card, so the grid stays clean at rest;
           once a card is picked, keep it visible so selections stay legible
           without needing to keep the mouse over each one. */
        .pick {
            position: absolute; top: 8px; right: 8px; width: 20px; height: 20px;
            margin: 0; accent-color: #667eea; cursor: pointer; z-index: 2;
            opacity: 0; transition: opacity .12s;
        }
        .card:hover .pick, .pick:checked { opacity: 1; }

        .toast {
            position: fixed; bottom: 26px; left: 50%; transform: translate(-50%, 90px);
            background: #10b981; color: #fff; padding: 12px 22px; border-radius: 11px;
            font: 600 13px inherit; z-index: 200; transition: transform .3s, opacity .3s; opacity: 0;
        }
        .toast.show { transform: translate(-50%, 0); opacity: 1; }
        .toast.err { background: #ef4444; }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="gallery-layout">
            <aside class="ws-sidebar">
                <h4>Workspaces</h4>
                <div class="ws-list" id="wsList">
                    <div class="ws-item" style="opacity:.5;pointer-events:none"><span class="ws-name">Loading…</span></div>
                </div>
            </aside>

            <div class="gallery-main">
                <div class="head">
                    <div class="head-icon"><i class="fas fa-images"></i></div>
                    <div>
                        <h1>Capture Gallery</h1>
                        <p>Every screenshot and recording, with the page context it was taken in</p>
                    </div>
                    <div class="head-actions">
                        <button class="btn" id="refreshBtn" style="display:none"><i class="fas fa-rotate"></i> Refresh</button>
                        <button class="btn danger" id="clearBtn" style="display:none"><i class="fas fa-trash"></i> Clear all</button>
                    </div>
                </div>

                <div class="stats" id="stats">
                    <div class="stat"><div class="v">–</div><div class="l">Captures</div></div>
                    <div class="stat"><div class="v">– / –</div><div class="l">Images / Videos</div></div>
                    <div class="stat"><div class="v">–</div><div class="l">Storage used</div></div>
                    <div class="stat"><div class="v">–</div><div class="l">With issues</div></div>
                    <div class="stat"><div class="v">–</div><div class="l">Shared</div></div>
                </div>

                <div class="bar">
                    <div class="search">
                        <i class="fas fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Search by title, page URL or console error&hellip;">
                    </div>
                    <select class="sel" id="dateFilter" title="Date range">
                        <option value="all">Any time</option>
                        <option value="today">Today</option>
                        <option value="week">Last 7 days</option>
                        <option value="month">Last 30 days</option>
                    </select>
                    <select class="sel" id="sortBy" title="Sort">
                        <option value="new">Newest first</option>
                        <option value="old">Oldest first</option>
                        <option value="big">Largest first</option>
                        <option value="errors">Most errors</option>
                    </select>
                </div>

                <div class="bar">
                    <div class="tabs">
                        <button class="tab active" data-filter="all"><i class="fas fa-layer-group"></i> All <span class="n" id="nAll">0</span></button>
                        <button class="tab" data-filter="image"><i class="fas fa-image"></i> Images <span class="n" id="nImage">0</span></button>
                        <button class="tab" data-filter="video"><i class="fas fa-video"></i> Videos <span class="n" id="nVideo">0</span></button>
                        <button class="tab" data-filter="issues"><i class="fas fa-bug"></i> With issues <span class="n" id="nIssues">0</span></button>
                        <button class="tab" data-filter="cloud"><i class="fas fa-cloud"></i> Shared <span class="n" id="nCloud">0</span></button>
                    </div>
                    <label class="selall"><input type="checkbox" id="selectAll"> Select all</label>
                </div>

                <div class="bulk" id="bulkBar">
                    <span id="bulkCount">0 selected</span>
                    <button class="btn" id="bulkDownload"><i class="fas fa-download"></i> Download</button>
                    <button class="btn danger" id="bulkDelete"><i class="fas fa-trash"></i> Delete</button>
                    <button class="btn" id="bulkCancel">Cancel</button>
                </div>

                <div id="content">
                    <div class="loader">
                        <div class="spin"></div>Loading your captures&hellip;
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="confirm" id="confirmBox">
        <div class="confirm-box">
            <header><i class="fas fa-triangle-exclamation"></i><span id="confirmTitle"></span></header>
            <p id="confirmText"></p>
            <p class="warn" id="confirmWarn"></p>
            <footer>
                <button class="confirm-cancel" id="confirmCancel">Cancel</button>
                <button class="confirm-ok" id="confirmOk">Delete</button>
            </footer>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal">
            <div class="modal-head">
                <h2 id="pvTitle">Capture</h2>

                <button class="x" id="pvNext" title="Next (→)"><i class="fas fa-chevron-right"></i></button>

                <button class="btn" id="pvDownload"><i class="fas fa-download"></i> Download</button>
