<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture Gallery - QA Testing Toolkit</title>
    <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="editor.css">
    <style>
        body {
            overflow: auto;
            background: var(--bg-darker);
            padding: 40px;
        }

        .history-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .history-card {
            background: var(--bg-dark);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .history-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-blue);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-preview {
            height: 180px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .card-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .history-card:hover .card-preview img {
            opacity: 1;
        }

        .video-icon {
            font-size: 48px;
            color: var(--accent-blue);
            opacity: 0.8;
        }

        .card-info {
            padding: 20px;
        }

        .card-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .card-actions {
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid var(--glass-border);
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            gap: 8px;
        }

        .card-actions button {
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            padding: 0;
            width: 100%;
        }

        .card-actions button i {
            font-size: 14px;
            opacity: 0.8;
        }

        .card-actions .copy-btn {
            background: var(--accent-blue);
            border: none;
            color: white;
            font-weight: 600;
            gap: 6px;
            font-size: 12px;
        }

        .card-actions .copy-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .card-actions button:not(.copy-btn):hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .download-btn:hover i {
            color: #7bed9f;
            opacity: 1;
        }

        .edit-btn:hover i {
            color: #70a1ff;
            opacity: 1;
        }

        .open-btn:hover i {
            color: #ffffff;
            opacity: 1;
        }

        .delete-btn:hover {
            background: rgba(231, 76, 60, 0.1) !important;
            border-color: rgba(231, 76, 60, 0.2) !important;
        }

        .delete-btn:hover i {
            color: #ff6b81;
            opacity: 1;
        }

        .history-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.03);
            padding: 15px 25px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            gap: 20px;
            flex-wrap: wrap;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .tab-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .tab-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            margin-left: 8px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .tab-btn.active .tab-count {
            background: rgba(255, 255, 255, 0.25);
            color: white;
        }

        .tab-btn:hover .tab-count {
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 15px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: white;
            padding: 8px 0;
            outline: none;
            font-family: inherit;
        }

        /* Pagination Styles */
        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 50px;
            padding-bottom: 50px;
        }

        .pagination-controls button {
            min-width: 100px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
        }

        .pagination-controls button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        #pageInfo {
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* Card Button Consistency Fix */
        .card-actions {
            justify-content: space-between !important;
            gap: 8px !important;
        }

        .card-actions button {
            flex: 1 !important;
            padding: 10px 0 !important;
            border-radius: 12px !important;
            max-width: none !important;
        }

        .card-actions button.copy-btn {
            flex: 2 !important;
        }

        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        /* Media Preview Modal */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .preview-modal.show {
            display: flex;
            opacity: 1;
        }

        .preview-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: previewZoom 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes previewZoom {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .preview-content img,
        .preview-content video {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .preview-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 101;
        }

        .preview-close:hover {
            background: rgba(231, 76, 60, 0.8);
            border-color: #ff6b81;
            transform: scale(1.1);
        }

        .preview-actions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 101;
        }

        .preview-action-btn {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .preview-action-btn:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 120, 212, 0.3);
        }

        .preview-action-btn i {
            font-size: 14px;
        }

        .card-preview {
            cursor: zoom-in;
        }

        .card-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            color: white;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            opacity: 0.8;
            transition: all 0.3s;
        }

        .history-card:hover .video-overlay-icon {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
            color: var(--accent-blue);
        }
    </style>
</head>

<body>
    <div class="history-container">
        <div class="history-controls">
            <div class="filter-tabs">
                <button class="tab-btn active" data-type="all">All <span class="tab-count"
                        id="count-all">0</span></button>
                <button class="tab-btn" data-type="image">Images <span class="tab-count"
                        id="count-image">0</span></button>
                <button class="tab-btn" data-type="video">Videos <span class="tab-count"
                        id="count-video">0</span></button>
            </div>
            <div class="search-bar">
                <i class="fas fa-calendar-alt"></i>
                <input type="date" id="dateFilter">
            </div>
        </div>

        <div id="historyGrid" class="history-grid">
            <!-- Items injected here -->
        </div>

        <div class="pagination-controls" id="pagination">
            <button id="prevPage" disabled><i class="fas fa-chevron-left"></i> Prev</button>
            <span id="pageInfo">Page 1</span>
            <button id="nextPage">Next <i class="fas fa-chevron-right"></i></button>
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <i class="fas fa-cloud"></i>
            <h2>No cloud items yet</h2>
            <p>Upload your captures from the editor to see them here.</p>
        </div>
    </div>

    <div id="globalLoader" class="loader-overlay">
        <div class="spinner"></div>
        <div class="loader-text" id="loaderText">Loading Gallery...</div>
    </div>

    <!-- Custom Modal System -->
    <div id="customModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Confirmation</h3>
                <button class="modal-close" id="modalCloseBtn">&times;</button>
            </div>
            <div class="modal-body">
                <p id="modalMessage"></p>
                <div id="modalInputContainer" style="display: none; margin-top: 15px;">
                    <label
                        style="display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-secondary);">Capture
                        Title</label>
                    <input type="text" id="modalInput" placeholder="Enter title...">
                </div>
            </div>
            <div class="modal-footer">
                <button id="modalSecondaryBtn" class="btn-secondary">Cancel</button>
                <button id="modalPrimaryBtn" class="primary">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Media Preview Modal -->
    <div id="mediaPreviewModal" class="preview-modal">
        <div class="preview-content">
            <button class="preview-close" id="previewClose" title="Close Preview">&times;</button>
            <div id="previewMediaContainer"></div>
            <div class="preview-actions" id="previewActions">
                <!-- Action buttons injected here -->
            </div>
        </div>
    </div>

    <script type="module" src="history.js"></script>
</body>

</html>
