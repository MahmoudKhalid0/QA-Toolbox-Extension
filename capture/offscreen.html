<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Recorder - QA Testing Toolkit</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .status {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="status">
        <h2>Recording in progress...</h2>
        <p>This tab is recording your screen.</p>
    </div>
    <!-- The recording is handed to the editor as a Blob through IndexedDB, never
         as a base64 data URL. Must load before offscreen.js. -->
    <script src="cap-store.js"></script>
    <script src="offscreen.js"></script>
</body>

</html>
