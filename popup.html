<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>QA-Toolbox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Hosted in the Chrome side panel - fill whatever width the user gives it */
            width: 100%;
            min-width: 300px;
            min-height: 100vh;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Login button (header, shown when not signed in to sync) */
        .login-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 0 10px;
            height: 34px;
            border-radius: 9px;
            cursor: pointer;
            margin-right: 6px;
            transition: background 0.2s;
        }
        .login-btn:hover { background: rgba(255, 255, 255, 0.18); }
        .login-btn i { color: #38bdf8; }

        /* Cloud sync indicator (header) */
        .sync-indicator {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
            margin-right: 2px;
        }
        .sync-indicator.syncing i {
            animation: syncSpin 1s linear infinite;
            color: #38bdf8;
        }
        .sync-indicator.error { color: #f87171; }
        @keyframes syncSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            min-width: 0;
        }

        .logo-text h1 {
            font-size: 18px;
            font-weight: 700;
            color: white;
            white-space: nowrap;
        }

        .logo-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .settings-icon-btn {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border: none;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.25s;
        }

        .settings-icon-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            transform: rotate(60deg);
        }

        .header-groups {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .group-title {
            font-size: 8.5px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            padding-left: 2px;
        }

        .group-btns {
            display: flex;
            gap: 6px;
            flex: 1;
        }

        .header-btn {
            /* Fixed third-of-row width so buttons keep the same size
               regardless of how many are in the row */
            flex: 0 0 calc((100% - 12px) / 3);
            min-width: 0;
            padding: 9px 4px 7px;
            border-radius: 11px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .header-btn .btn-label {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .header-btn:hover {
            transform: translateY(-2px);
        }

        .btn-record {
            background: #ef4444;
            color: white;
        }

        .btn-record:hover {
            background: #dc2626;
        }

        .btn-record.recording {
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }

            50% {
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }
        }

        .btn-add:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-ai {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
        }

        .btn-ai:hover {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
        }

        .btn-ai:disabled {
            opacity: 0.7;
            cursor: wait;
            transform: none;
        }

        .btn-inspect {
            background: linear-gradient(135deg, #0ea5e9, #06b6d4);
            color: white;
        }

        .btn-inspect:hover {
            background: linear-gradient(135deg, #0284c7, #0891b2);
        }

        .btn-add {
            background: rgba(255, 255, 255, 0.18);
            color: white;
        }

        /* Tab navigation */
        .tab-bar {
            display: flex;
            background: #16162e;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 5;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            padding: 12px 8px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            font-family: inherit;
        }

        .tab-btn:hover {
            color: rgba(255, 255, 255, 0.85);
        }

        .tab-btn.active {
            color: white;
            border-bottom-color: #667eea;
            background: rgba(102, 126, 234, 0.08);
        }

        .tab-page.hidden {
            display: none;
        }

        .profile-actions {
            margin-bottom: 14px;
        }

        /* Tool cards (Tools tab) */
        .tool-card {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            margin-bottom: 10px;
        }

        .tool-card:hover {
            background: rgba(14, 165, 233, 0.12);
            border-color: rgba(14, 165, 233, 0.45);
            transform: translateY(-1px);
        }

        .tool-card-icon {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: white;
        }

        .tool-card-info h4 {
            font-size: 13.5px;
            color: white;
            margin-bottom: 3px;
        }

        .tool-card-info p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.5;
        }

        /* Inspector sub-options (shown when the Inspector card is clicked) */
        .tool-card-chevron {
            margin-left: auto;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            transition: transform 0.2s;
        }
        .tool-card.open .tool-card-chevron { transform: rotate(180deg); }

        .tool-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: -6px 0 12px 18px;
            padding: 10px 0 4px 14px;
            border-left: 2px solid rgba(255, 255, 255, 0.1);
        }
        .tool-options.hidden { display: none; }

        .tool-option {
            display: flex;
            align-items: center;
            gap: 11px;
            text-align: left;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 11px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tool-option:hover {
            background: rgba(14, 165, 233, 0.12);
            border-color: rgba(14, 165, 233, 0.45);
        }
        .tool-option.active {
            background: rgba(139, 92, 246, 0.22);
            border-color: rgba(139, 92, 246, 0.7);
            box-shadow: 0 0 0 1px rgba(139, 92, 246, 0.4) inset;
        }
        .tool-option.active::after {
            content: 'picking…';
            margin-left: auto;
            font-size: 10px;
            color: #c4b5fd;
            font-weight: 600;
        }
        .tool-option > i {
            font-size: 14px;
            width: 18px;
            text-align: center;
            flex-shrink: 0;
        }
        .tool-option h5 {
            font-size: 12px;
            color: white;
            margin-bottom: 2px;
        }
        .tool-option p {
            font-size: 10.5px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.4;
        }

        /* Inline AI tool forms (input lives in the panel, result opens in a tab) */
        .tool-form {
            margin: -6px 0 12px 18px;
            padding: 12px 14px;
            border-left: 2px solid rgba(255, 255, 255, 0.1);
        }
        .tool-form.hidden,
        .tool-form-thumb.hidden,
        #brFile { display: none; }
        .tool-form textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9px;
            color: #fff;
            font: 13px/1.5 inherit;
            padding: 9px 11px;
            outline: none;
            resize: vertical;
            min-height: 80px;
        }
        .tool-form textarea:focus { border-color: #6366f1; }
        .tool-form-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .tool-form-row label { font-size: 11.5px; color: rgba(255, 255, 255, 0.6); }
        .tool-form select {
            background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff; border-radius: 7px; padding: 5px 8px; font-size: 12px; outline: none;
        }
        .tool-form select option { background: #1e293b; color: #fff; }
        .tool-form-gen {
            margin-left: auto; border: none; border-radius: 8px; padding: 8px 14px;
            font-size: 12px; font-weight: 700; color: #fff; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
        }
        .tool-form-gen:hover { filter: brightness(1.12); }
        .tool-form-gen:disabled { opacity: 0.6; cursor: wait; }
        .tool-form-drop {
            border: 2px dashed rgba(255, 255, 255, 0.15); border-radius: 8px; padding: 12px;
            text-align: center; cursor: pointer; color: #64748b; font-size: 11.5px; margin-top: 10px;
        }
        .tool-form-drop:hover { border-color: #6366f1; color: #cbd5e1; }
        .tool-form-thumb { position: relative; display: inline-block; margin-top: 10px; }
        .tool-form-thumb img { max-height: 90px; max-width: 100%; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); display: block; }
        .tool-form-thumb button { position: absolute; top: -7px; right: -7px; background: #ef4444; border: none; color: #fff; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 10px; }
        .tool-form-status { font-size: 11.5px; margin-top: 8px; min-height: 14px; }

        /* Countdown timer */
        .timer-display {
            font-size: 34px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            text-align: center;
            color: #fff;
            letter-spacing: 2px;
            margin: 4px 0 12px;
            font-family: 'Segoe UI', monospace;
        }
        .timer-display.finished { animation: timerFlash 0.8s ease-in-out infinite; }
        @keyframes timerFlash {
            0%, 100% { color: #fff; }
            50% { color: #ef4444; }
        }
        .timer-inputs { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
        .timer-inputs.hidden { display: none; }
        .timer-unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .timer-unit input {
            width: 56px; text-align: center; background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; color: #fff;
            font-size: 16px; padding: 8px 4px; outline: none;
        }
        .timer-unit input:focus { border-color: #f59e0b; }
        .timer-unit span { font-size: 10px; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; }
        .timer-btn {
            border: none; border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 700;
            color: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255, 255, 255, 0.12);
        }
        .timer-btn:hover { background: rgba(255, 255, 255, 0.22); }
        .timer-btn.hidden, .tool-form-gen.hidden { display: none; }

        /* Debug tab (Console) */
        .dbg-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .dbg-filters { display: flex; gap: 5px; flex-wrap: wrap; }
        .dbg-filter {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #cbd5e1;
            padding: 5px 9px; border-radius: 14px; font-size: 11px; cursor: pointer; font-family: inherit;
        }
        .dbg-filter span { opacity: 0.7; margin-left: 2px; }
        .dbg-filter.active { background: rgba(99, 102, 241, 0.25); border-color: rgba(99, 102, 241, 0.6); color: #fff; }
        .dbg-actions { display: flex; gap: 6px; }
        .dbg-btn {
            background: rgba(255, 255, 255, 0.1); border: none; color: #fff; cursor: pointer;
            padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
        }
        .dbg-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .dbg-explain { background: linear-gradient(135deg, #8b5cf6, #6366f1); }
        .dbg-explain:disabled { opacity: 0.6; cursor: wait; }
        .dbg-status { font-size: 11.5px; color: #94a3b8; min-height: 14px; margin-bottom: 6px; }
        .dbg-list { display: flex; flex-direction: column; gap: 4px; }
        .dbg-row {
            display: flex; gap: 8px; align-items: flex-start; padding: 7px 10px; border-radius: 8px;
            background: rgba(255, 255, 255, 0.03); border-left: 3px solid transparent; font-size: 12px;
        }
        .dbg-row.error { border-left-color: #ef4444; background: rgba(239, 68, 68, 0.07); }
        .dbg-row.warn { border-left-color: #f59e0b; background: rgba(245, 158, 11, 0.06); }
        .dbg-row.log { border-left-color: #475569; }
        .dbg-row .dbg-msg { flex: 1; color: #e2e8f0; white-space: pre-wrap; word-break: break-word; font-family: 'Consolas', monospace; line-height: 1.5; }
        .dbg-row .dbg-src { color: #60a5fa; font-size: 10.5px; white-space: nowrap; cursor: pointer; font-family: 'Consolas', monospace; align-self: flex-start; }
        .dbg-row .dbg-src:hover { text-decoration: underline; }
        .dbg-row .dbg-count { background: rgba(255,255,255,0.15); color: #fff; border-radius: 10px; padding: 0 6px; font-size: 10px; height: 16px; display: inline-flex; align-items: center; flex-shrink: 0; }
        .dbg-row .dbg-copy { background: rgba(255,255,255,0.08); border: none; color: rgba(255,255,255,0.6); cursor: pointer; border-radius: 5px; width: 22px; height: 20px; flex-shrink: 0; font-size: 10px; }
        .dbg-row .dbg-copy:hover { background: rgba(255,255,255,0.2); color: #fff; }
        .dbg-tab-badge { background: #ef4444; color: #fff; border-radius: 10px; min-width: 16px; height: 16px; padding: 0 5px; font-size: 10px; font-weight: 700; align-items: center; justify-content: center; margin-left: 5px; }
        .dbg-empty { text-align: center; color: #64748b; padding: 30px 10px; font-size: 13px; }
        /* AI findings */
        .dbg-finding { background: rgba(139,92,246,0.08); border: 1px solid rgba(139,92,246,0.3); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
        .dbg-finding h5 { font-size: 13px; color: #fff; margin-bottom: 4px; display: flex; align-items: center; gap: 7px; }
        .dbg-finding .sev { font-size: 9px; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 8px; }
        .dbg-finding .sev.high { background: rgba(239,68,68,0.2); color: #fca5a5; }
        .dbg-finding .sev.medium { background: rgba(245,158,11,0.2); color: #fcd34d; }
        .dbg-finding .sev.low { background: rgba(16,185,129,0.2); color: #6ee7b7; }
        .dbg-finding p { font-size: 12px; color: #cbd5e1; line-height: 1.6; margin-top: 4px; }
        .dbg-finding .fix { color: #7dd3fc; }

        /* Debug: Console/Network switcher */
        #dbg-console-panel.hidden, #dbg-network-panel.hidden, #dbg-security-panel.hidden, .net-detail.hidden { display: none; }

        /* Security panel */
        .sec-score-wrap { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .sec-score { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; flex-shrink: 0; color: #fff; }
        .sec-score.good { background: conic-gradient(#10b981 var(--p), rgba(255,255,255,0.08) 0); }
        .sec-score.mid { background: conic-gradient(#f59e0b var(--p), rgba(255,255,255,0.08) 0); }
        .sec-score.bad { background: conic-gradient(#ef4444 var(--p), rgba(255,255,255,0.08) 0); }
        .sec-score span { background: #1a1a2e; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .sec-score-info h4 { font-size: 14px; color: #fff; margin-bottom: 3px; }
        .sec-score-info p { font-size: 11.5px; color: #94a3b8; }
        .sec-group-title { font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #64748b; margin: 12px 0 6px; }
        .sec-row { display: flex; align-items: flex-start; gap: 9px; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,0.03); margin-bottom: 4px; font-size: 12px; }
        .sec-row i { margin-top: 1px; flex-shrink: 0; }
        .sec-row.pass i { color: #6ee7b7; }
        .sec-row.fail i { color: #f87171; }
        .sec-row.warn i { color: #fcd34d; }
        .sec-row .sec-body { flex: 1; min-width: 0; }
        .sec-row .sec-name { color: #e2e8f0; font-weight: 600; }
        .sec-row .sec-desc { color: #94a3b8; font-size: 11px; margin-top: 2px; }
        .sec-row .sec-warn { color: #fcd34d; font-size: 11px; margin-top: 2px; }
        .sec-row .sec-val { color: #64748b; font-size: 10.5px; font-family: 'Consolas', monospace; margin-top: 3px; word-break: break-all; }
        .dbg-finding .sec-area { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: .5px; margin-left: auto; }
        .sec-facts { margin-top: 14px; }
        .sec-facts > summary { cursor: pointer; color: #94a3b8; font-size: 12px; padding: 6px 0; list-style: revert; }
        .sec-facts > summary:hover { color: #cbd5e1; }
        .dbg-mode-switch { display: flex; gap: 4px; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 3px; margin-bottom: 12px; }
        .dbg-mode {
            flex: 1; background: transparent; border: none; color: #94a3b8; cursor: pointer; font-family: inherit;
            padding: 7px 8px; border-radius: 8px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .dbg-mode.active { background: rgba(99,102,241,0.25); color: #fff; }
        .dbg-mode-badge { background: #ef4444; color: #fff; border-radius: 9px; min-width: 15px; height: 15px; padding: 0 4px; font-size: 9.5px; font-weight: 700; display: none; align-items: center; justify-content: center; }
        .dbg-mode-badge.show { display: inline-flex; }

        /* Network rows */
        .net-filter {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #cbd5e1;
            padding: 5px 9px; border-radius: 14px; font-size: 11px; cursor: pointer; font-family: inherit;
        }
        .net-filter span { opacity: 0.7; margin-left: 2px; }
        .net-filter.active { background: rgba(99, 102, 241, 0.25); border-color: rgba(99, 102, 241, 0.6); color: #fff; }
        .net-row {
            display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 8px; cursor: pointer;
            background: rgba(255, 255, 255, 0.03); border-left: 3px solid #475569; font-size: 12px;
        }
        .net-row.failed { border-left-color: #ef4444; background: rgba(239, 68, 68, 0.07); }
        .net-method { font-weight: 700; font-size: 10px; color: #a5b4fc; min-width: 38px; font-family: 'Consolas', monospace; }
        .net-status { font-weight: 700; font-size: 11px; font-family: 'Consolas', monospace; min-width: 26px; }
        .net-status.s2xx { color: #6ee7b7; }
        .net-status.s3xx { color: #fcd34d; }
        .net-status.s4xx { color: #fca5a5; }
        .net-status.s5xx, .net-status.serr { color: #ef4444; }
        .net-url { flex: 1; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
        .net-dur { color: #64748b; font-size: 10.5px; white-space: nowrap; }
        .net-copy { background: rgba(255,255,255,0.08); border: none; color: rgba(255,255,255,0.6); cursor: pointer; border-radius: 5px; width: 22px; height: 20px; flex-shrink: 0; font-size: 10px; }
        .net-copy:hover { background: rgba(255,255,255,0.2); color: #fff; }
        .net-detail { background: rgba(0,0,0,0.25); border-radius: 8px; margin: 2px 0 6px; padding: 8px 10px; font-size: 11px; font-family: 'Consolas', monospace; }
        .net-detail .nd-sec { color: #94a3b8; text-transform: uppercase; font-size: 9.5px; letter-spacing: .5px; margin: 8px 0 3px; }
        .net-detail .nd-sec:first-child { margin-top: 0; }
        .net-detail pre { white-space: pre-wrap; word-break: break-word; color: #cbd5e1; line-height: 1.5; margin: 0; max-height: 160px; overflow: auto; }
        .net-detail .nd-url { color: #60a5fa; word-break: break-all; }
        .net-detail .nd-key { color: #7dd3fc; }
        .net-detail .nd-val { color: #e2e8f0; }
        .net-detail .nd-err { color: #fca5a5; }
        .net-detail .nd-init { color: #94a3b8; }
        .net-detail .net-status { font-size: 11px; }
        /* JSON syntax highlight */
        .net-detail .j-key { color: #7dd3fc; }
        .net-detail .j-str { color: #86efac; }
        .net-detail .j-num { color: #fcd34d; }
        .net-detail .j-bool { color: #c084fc; }
        .net-detail .j-null { color: #fca5a5; }

        .tools-coming {
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
        }

        .btn-ai.loading i {
            animation: ai-spin 1s linear infinite;
        }

        @keyframes ai-spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Content */
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        /* Profile Cards */
        .profile-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            transition: all 0.2s;
        }

        .profile-card:hover {
            transform: translateY(-2px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .profile-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: white;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 15px;
            font-weight: 600;
            color: white;
            margin-bottom: 4px;
        }

        .profile-meta {
            font-size: 12px;
            color: #888;
        }

        .profile-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-fill {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            width: auto;
            padding: 0 16px;
            font-weight: 600;
            font-size: 12px;
        }

        .btn-fill:hover {
            transform: scale(1.05);
        }

        .btn-edit {
            background: rgba(255, 255, 255, 0.1);
            color: #888;
        }

        .btn-edit:hover {
            background: rgba(102, 126, 234, 0.3);
            color: #667eea;
        }

        .btn-delete {
            background: rgba(255, 255, 255, 0.1);
            color: #888;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .btn-record-more {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .btn-record-more:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: scale(1.05);
        }

        .btn-record-more.active {
            background: #ef4444;
            color: white;
            animation: pulse-red 1.5s infinite;
        }

        .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .profile-card.recording-active {
            border-color: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }

        @keyframes pulse-red {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }

            70% {
                transform: scale(1.05);
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 18px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .4s;
            border-radius: 18px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #10b981;
        }

        input:checked+.slider:before {
            transform: translateX(16px);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #888;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 10px;
            border-radius: 8px;
            margin-right: auto;
        }

        /* Category Header Styles */
        .category-group {
            margin-bottom: 8px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.02);
            display: grid;
            grid-template-rows: auto 0fr;
            transition: grid-template-rows 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .category-group.expanded {
            grid-template-rows: auto 1fr;
        }

        .category-header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .category-header:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .category-title-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .category-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
            font-size: 14px;
        }

        .category-title {
            font-size: 14px;
            font-weight: 600;
            color: #aaa;
            text-transform: capitalize;
        }

        .category-count {
            font-size: 11px;
            color: #555;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .category-chevron {
            font-size: 12px;
            color: #555;
            transition: transform 0.3s;
        }

        .category-group.expanded .category-chevron {
            transform: rotate(180deg);
        }

        .category-group.expanded .category-title {
            color: #fff;
        }

        .category-content {
            overflow: hidden;
            padding: 0 12px;
            opacity: 0;
            transition: opacity 0.5s ease, padding 0.5s ease;
        }

        .category-group.expanded .category-content {
            opacity: 1;
            padding: 12px;
        }

        /* Category Filter Styles */
        .filter-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-container {
            flex: 1;
        }

        .category-select-wrapper {
            width: 110px;
            position: relative;
        }

        .category-select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
            font-size: 13px;
            appearance: none;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        /* Smart Filter Banner */
        .smart-filter-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.2);
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .smart-filter-banner.active {
            display: flex;
        }

        .smart-filter-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #667eea;
            font-weight: 500;
        }

        .btn-show-all {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-show-all:hover {
            background: #764ba2;
            transform: translateY(-1px);
        }

        .category-select:focus {
            border-color: #667eea;
            color: white;
        }

        .category-select option {
            background-color: #1a1a2e;
            color: white;
        }

        /* Settings Panel Styles */
        .settings-panel {
            background: #1a1a2e;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease-out;
        }

        .settings-panel.open {
            max-height: 400px;
            padding: 20px;
        }

        .settings-section {
            margin-bottom: 20px;
        }

        .settings-section h4 {
            font-size: 11px;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .category-manage-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-right: 4px;
        }

        .category-manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cat-name-text {
            font-size: 13px;
            color: #e0e0e0;
        }

        .btn-delete-cat {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 12px;
            transition: color 0.2s;
        }

        .btn-delete-cat:hover {
            color: #ef4444;
        }

        .add-cat-form {
            display: flex;
            gap: 8px;
        }

        .add-cat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            font-size: 13px;
        }

        .add-cat-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-add-cat {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 12px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Backup & Restore Styles */
        .backup-footer {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-backup {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: #ccc;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-backup:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-backup.import-btn:hover {
            color: #10b981;
            border-color: #10b981;
        }

        .btn-backup.export-btn:hover {
            color: #667eea;
            border-color: #667eea;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: #667eea;
        }

        .empty-state h3 {
            font-size: 16px;
            color: white;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .modal-header h3 {
            font-size: 18px;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-header h3 i {
            color: #667eea;
        }

        .modal-close {
            background: none;
            border: none;
            color: #666;
            font-size: 20px;
            cursor: pointer;
        }

        .modal-close:hover {
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-input::placeholder {
            color: #555;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .fields-section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .fields-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .fields-header h4 {
            font-size: 14px;
            color: white;
        }

        .btn-add-field {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            border: 1px dashed #667eea;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add-field:hover {
            background: rgba(102, 126, 234, 0.3);
        }

        .field-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .field-row input {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 13px;
        }

        .field-row input::placeholder {
            color: #555;
        }

        .field-row input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-remove-field {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: none;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-remove-field:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .tip {
            font-size: 11px;
            color: #555;
            margin-top: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-actions button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #888;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="header">
            <div class="logo-row">
                <div class="logo">
                    <div class="logo-icon"><i class="fas fa-toolbox"></i></div>
                    <div class="logo-text">
                        <h1>QA-Toolbox</h1>
                    </div>
                </div>
                <span class="sync-indicator" id="syncIndicator" style="display:none;">
                    <i class="fas fa-cloud"></i>
                </span>
                <button class="login-btn" id="loginBtn" style="display:none;" title="Sign in with Google to sync your data">
                    <i class="fab fa-google"></i><span>Login</span>
                </button>
                <button class="settings-icon-btn" id="settingsBtn" title="Settings">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" data-tab="profiles">
                <i class="fas fa-keyboard"></i> Form Filler
            </button>
            <button class="tab-btn" data-tab="tools">
                <i class="fas fa-toolbox"></i> Tools
            </button>
            <button class="tab-btn" data-tab="debug">
                <i class="fas fa-bug"></i> Debug
                <span id="dbgTabBadge" class="dbg-tab-badge" style="display:none;"></span>
            </button>
        </div>

        <div class="content">
            <!-- Profiles tab -->
            <div class="tab-page" id="tab-profiles">
                <div class="group-btns profile-actions">
                    <button class="header-btn btn-record" id="recordBtn" title="Record Form">
                        <i class="fas fa-circle"></i>
                        <span class="btn-label">Record</span>
                    </button>
                    <button class="header-btn btn-ai" id="aiBtn" title="AI Create Profile">
                        <i class="fas fa-wand-magic-sparkles"></i>
                        <span class="btn-label">AI Fill</span>
                    </button>
                    <button class="header-btn btn-add" id="addBtn" title="Create a profile manually">
                        <i class="fas fa-user-plus"></i>
                        <span class="btn-label">New Profile</span>
                    </button>
                </div>
                <div class="filter-area">
                    <div class="search-container">
                        <input type="text" id="searchInput" placeholder="Search profiles..."
                            style="width:100%;padding:12px 16px;border:1px solid rgba(255,255,255,0.1);border-radius:12px;background:rgba(255,255,255,0.05);color:white;font-size:14px; outline:none;">
                    </div>
                    <div class="category-select-wrapper">
                        <select id="categoryFilter" class="category-select">
                            <option value="all">All Categories</option>
                        </select>
                    </div>
                </div>
                <div id="smartFilterBanner" class="smart-filter-banner">
                    <div class="smart-filter-info">
                        <i class="fas fa-magic"></i>
                        <span id="smartFilterText">Showing profiles for this page</span>
                    </div>
                    <button id="showAllBtn" class="btn-show-all">Show All</button>
                </div>
                <div id="profilesList"></div>
            </div>

            <!-- Tools tab -->
            <div class="tab-page hidden" id="tab-tools">
                <button class="tool-card" id="inspectorToolBtn" title="Inspector">
                    <div class="tool-card-icon" style="background: linear-gradient(135deg, #0ea5e9, #06b6d4);">
                        <i class="fas fa-crosshairs"></i>
                    </div>
                    <div class="tool-card-info">
                        <h4>Inspector</h4>
                        <p>Pick an element on the page and choose what you need &mdash; inspect it, get its XPath, or
                            let AI suggest locators</p>
                    </div>
                    <i class="fas fa-chevron-down tool-card-chevron"></i>
                </button>
                <div class="tool-options hidden" id="inspectorOptions">
                    <button class="tool-option" id="inspectBtn" title="Element Inspector">
                        <i class="fas fa-crosshairs" style="color:#06b6d4;"></i>
                        <div>
                            <h5>Element Inspector</h5>
                            <p>Selector, attributes, CSS rules &amp; live style editing</p>
                        </div>
                    </button>
                    <button class="tool-option" id="xpathBtn" title="XPath Finder">
                        <i class="fas fa-bullseye" style="color:#f59e0b;"></i>
                        <div>
                            <h5>XPath Finder</h5>
                            <p>Instant XPath &mdash; free and works offline</p>
                        </div>
                    </button>
                    <button class="tool-option" id="aiXpathBtn" title="AI Locator Finder">
                        <i class="fas fa-wand-magic-sparkles" style="color:#8b5cf6;"></i>
                        <div>
                            <h5>AI Locator Finder</h5>
                            <p>XPath, CSS &amp; attribute &mdash; verified live, with a recommendation</p>
                        </div>
                    </button>
                    <button class="tool-option" id="ocrBtn" title="Image Text Extractor">
                        <i class="fas fa-image" style="color:#ec4899;"></i>
                        <div>
                            <h5>Image Text Extractor</h5>
                            <p>Pick an image &mdash; AI reads the text inside it (OCR)</p>
                        </div>
                    </button>
                </div>
                <div class="tools-coming">
                    <i class="fas fa-plus-circle"></i> More QA tools coming soon
                </div>
            </div>

            <!-- Debug tab -->
            <div class="tab-page hidden" id="tab-debug">
                <div class="dbg-mode-switch">
                    <button class="dbg-mode active" data-mode="console"><i class="fas fa-terminal"></i> Console <span class="dbg-mode-badge" id="dbgConsoleBadge"></span></button>
                    <button class="dbg-mode" data-mode="network"><i class="fas fa-wifi"></i> Network <span class="dbg-mode-badge" id="dbgNetBadge"></span></button>
                    <button class="dbg-mode" data-mode="security"><i class="fas fa-shield-halved"></i> Security</button>
                </div>

                <!-- Console panel -->
                <div id="dbg-console-panel">
                    <div class="dbg-toolbar">
                        <div class="dbg-filters">
                            <button class="dbg-filter active" data-level="all">All <span id="dbg-c-all">0</span></button>
                            <button class="dbg-filter" data-level="error">Errors <span id="dbg-c-error">0</span></button>
                            <button class="dbg-filter" data-level="warn">Warnings <span id="dbg-c-warn">0</span></button>
                            <button class="dbg-filter" data-level="log">Logs <span id="dbg-c-log">0</span></button>
                        </div>
                        <div class="dbg-actions">
                            <button class="dbg-btn dbg-explain" id="dbgExplainBtn"><i class="fas fa-wand-magic-sparkles"></i> Explain &amp; Fix</button>
                            <button class="dbg-btn" id="dbgClearBtn" title="Clear"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="dbg-status" id="dbgStatus"></div>
                    <div class="dbg-list" id="dbgList"></div>
                </div>

                <!-- Network panel -->
                <div id="dbg-network-panel" class="hidden">
                    <div class="dbg-toolbar">
                        <div class="dbg-filters">
                            <button class="net-filter active" data-nf="all">All <span id="net-c-all">0</span></button>
                            <button class="net-filter" data-nf="failed">Failed <span id="net-c-failed">0</span></button>
                            <button class="net-filter" data-nf="xhr">XHR/Fetch <span id="net-c-xhr">0</span></button>
                        </div>
                        <div class="dbg-actions">
                            <button class="dbg-btn dbg-explain" id="netExplainBtn"><i class="fas fa-wand-magic-sparkles"></i> Explain &amp; Fix</button>
                            <button class="dbg-btn" id="netClearBtn" title="Clear"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="dbg-status" id="netStatus"></div>
                    <div class="dbg-list" id="netList"></div>
                </div>

                <!-- Security panel -->
                <div id="dbg-security-panel" class="hidden">
                    <div class="dbg-toolbar">
                        <button class="dbg-btn dbg-explain" id="secScanBtn"><i class="fas fa-wand-magic-sparkles"></i> AI Scan this page</button>
                    </div>
                    <div class="dbg-status" id="secStatus"></div>
                    <div id="secResult"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-user-plus"></i> <span id="modalTitle">Add Profile</span></h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>

            <div class="form-group">
                <label>Profile Name</label>
                <input type="text" class="form-input" id="profileName" placeholder="e.g., Admin Account">
            </div>

            <div class="fields-section">
                <div class="fields-header">
                    <h4><i class="fas fa-list-ul"></i> Form Fields</h4>
                    <button class="btn-add-field" id="addFieldBtn">
                        <i class="fas fa-plus"></i> Add Field
                    </button>
                </div>
                <div id="fieldsContainer"></div>
                <div class="tip">
                    💡 <strong>CSS Selectors:</strong> #id, .class, input[name="field"], [data-testid="test"]
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" id="cancelBtn">Cancel</button>
                <button class="btn-save" id="saveBtn">Save Profile</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span>Form filled successfully!</span>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="deleteModal" style="background:rgba(0,0,0,0.85);">
        <div
            style="background:#1a1a2e;border-radius:20px;padding:28px;max-width:340px;text-align:center;border:1px solid rgba(255,255,255,0.1);">
            <div
                style="width:60px;height:60px;background:rgba(239,68,68,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
                <i class="fas fa-trash" style="font-size:24px;color:#ef4444;"></i>
            </div>
            <h3 style="color:white;font-size:18px;margin-bottom:10px;">Delete Profile?</h3>
            <p id="deleteModalMessage" style="color:#888;font-size:13px;margin-bottom:24px;">This action cannot be
                undone.</p>
            <div style="display:flex;gap:12px;">
                <button id="cancelDeleteBtn"
                    style="flex:1;padding:12px;border:none;border-radius:10px;background:rgba(255,255,255,0.1);color:#888;cursor:pointer;font-weight:600;">Cancel</button>
                <button id="confirmDeleteBtn"
                    style="flex:1;padding:12px;border:none;border-radius:10px;background:#ef4444;color:white;cursor:pointer;font-weight:600;">Delete</button>
            </div>
        </div>
    </div>

    <script src="db.js"></script>
    <script src="popup.js"></script>
</body>

</html>
