<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA-Toolbox — Responsive Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f17; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Toolbar */
        .rv-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #16162a; border-bottom: 1px solid rgba(255, 255, 255, 0.08); flex-shrink: 0; flex-wrap: wrap; }
        .rv-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: #fff; }
        .rv-brand i { color: #8b5cf6; }
        .rv-url { flex: 1; min-width: 220px; display: flex; gap: 6px; }
        .rv-url input { flex: 1; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 9px; color: #fff; padding: 9px 12px; font-size: 13px; outline: none; }
        .rv-url input:focus { border-color: #8b5cf6; }
        .rv-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); color: #e2e8f0; border-radius: 9px; padding: 8px 11px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; white-space: nowrap; }
        .rv-btn:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }
        .rv-btn.go { background: linear-gradient(135deg, #8b5cf6, #6366f1); border: none; color: #fff; font-weight: 600; }
        .rv-sel { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; border-radius: 9px; padding: 8px 10px; font-size: 13px; outline: none; cursor: pointer; }
        .rv-sel option { background: #16213e; }

        /* Stage */
        .rv-stage { flex: 1; overflow: auto; padding: 18px; }
        .rv-row { display: flex; gap: 20px; align-items: flex-start; min-width: min-content; }
        .rv-frame { flex-shrink: 0; }
        .rv-fhead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: #cbd5e1; }
        .rv-fname { font-weight: 600; font-size: 13px; }
        .rv-fdim { font-size: 11px; color: #64748b; font-family: Consolas, monospace; }
        .rv-fact { margin-left: auto; display: flex; gap: 4px; }
        .rv-fact button { background: rgba(255, 255, 255, 0.07); border: none; color: #94a3b8; cursor: pointer; width: 24px; height: 22px; border-radius: 6px; font-size: 11px; }
        .rv-fact button:hover { background: rgba(255, 255, 255, 0.18); color: #fff; }
        .rv-screen { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5); }
        .rv-screen iframe { border: 0; display: block; background: #fff; }
        .rv-empty { color: #64748b; text-align: center; padding: 60px 20px; width: 100%; }
    </style>
</head>

<body>
    <div class="rv-bar">
        <div class="rv-brand"><i class="fas fa-mobile-screen"></i> Responsive</div>
        <div class="rv-url">
            <input type="text" id="rv-url" placeholder="https://…" spellcheck="false">
            <button class="rv-btn go" id="rv-go"><i class="fas fa-arrow-right"></i> Go</button>
        </div>
        <button class="rv-btn" id="rv-reload" title="Reload all"><i class="fas fa-rotate-right"></i></button>
        <button class="rv-btn" id="rv-rotate" title="Rotate all"><i class="fas fa-rotate"></i> Rotate</button>
        <select class="rv-sel" id="rv-zoom" title="Zoom">
            <option value="0.4">40%</option>
            <option value="0.5" selected>50%</option>
            <option value="0.65">65%</option>
            <option value="0.75">75%</option>
            <option value="1">100%</option>
        </select>
        <select class="rv-sel" id="rv-add" title="Add a device"><option value="">+ Add device</option></select>
    </div>

    <div class="rv-stage">
        <div class="rv-row" id="rv-row"></div>
    </div>

    <script src="config.js"></script>
    <script src="responsive.js"></script>
</body>

</html>
